<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histree HQ — Studio Ops</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#0e1210;
  --ink-2:#161b18;
  --panel:#1a201d;
  --panel-2:#212824;
  --line:#2c332e;
  --line-soft:#232a26;
  --text:#e9ece8;
  --text-dim:#a4ada5;
  --text-faint:#6c766d;
  --amber:#e0a458;
  --amber-dim:#8a6a3f;
  --teal:#5fa8a0;
  --teal-dim:#3d6b66;
  --red:#c96a5a;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --radius:3px;
}
@font-face{font-family:'Fraunces';src:local('Georgia');}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--ink);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;font-size:14px;}
::selection{background:var(--amber);color:var(--ink);}

/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

/* ===== Layout shell ===== */
.shell{display:flex;min-height:100vh;}

/* Sprocket rail — signature element (film sprocket / timeline strip) */
.rail{
  width:54px;
  flex-shrink:0;
  background:var(--ink-2);
  border-right:1px solid var(--line-soft);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:18px 0;
  gap:22px;
}
.rail .hole{
  width:10px;height:10px;border-radius:50%;
  border:1px solid var(--line);
  flex-shrink:0;
}
.rail .brandmark{
  writing-mode:vertical-rl;
  text-orientation:mixed;
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:0.28em;
  color:var(--text-faint);
  margin:14px 0;
  flex-shrink:0;
}
.rail .holes-col{display:flex;flex-direction:column;gap:14px;}

/* Sidebar */
.sidebar{
  width:230px;
  flex-shrink:0;
  background:var(--ink-2);
  border-right:1px solid var(--line-soft);
  padding:22px 16px;
  display:flex;
  flex-direction:column;
}
.logo{
  font-family:var(--font-display);
  font-weight:600;
  font-size:20px;
  letter-spacing:-0.01em;
  color:var(--text);
  margin-bottom:2px;
}
.logo em{font-style:italic;color:var(--amber);}
.tagline{
  font-family:var(--font-mono);
  font-size:10px;
  color:var(--text-faint);
  letter-spacing:0.08em;
  text-transform:uppercase;
  margin-bottom:26px;
}
.nav-group{margin-bottom:22px;}
.nav-label{
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--text-faint);
  margin-bottom:8px;
  padding:0 8px;
}
.nav-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 8px;
  border-radius:var(--radius);
  color:var(--text-dim);
  font-size:13.5px;
  cursor:pointer;
  transition:background .12s, color .12s;
  border-left:2px solid transparent;
}
.nav-item:hover{background:var(--panel);color:var(--text);}
.nav-item.active{background:var(--panel-2);color:var(--text);border-left:2px solid var(--amber);}
.nav-item .count{
  margin-left:auto;
  font-family:var(--font-mono);
  font-size:10.5px;
  color:var(--text-faint);
}
.nav-item .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

.sidebar-foot{
  margin-top:auto;
  padding-top:14px;
  border-top:1px solid var(--line-soft);
  display:flex;
  flex-direction:column;
  gap:6px;
}
.ghost-btn{
  font-family:var(--font-mono);
  font-size:10.5px;
  letter-spacing:.04em;
  color:var(--text-faint);
  background:none;border:1px solid var(--line);
  padding:7px 10px;border-radius:var(--radius);
  text-align:left;
  transition:border-color .12s,color .12s;
}
.ghost-btn:hover{border-color:var(--amber-dim);color:var(--amber);}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:56px;flex-shrink:0;
  border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;
  padding:0 26px;
  gap:16px;
  background:var(--ink);
}
.topbar h1{
  font-family:var(--font-display);
  font-weight:600;
  font-size:18px;
  letter-spacing:-0.01em;
}
.topbar .sub{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--text-faint);
}
.topbar-spacer{flex:1;}
.btn{
  font-size:12.5px;
  font-weight:600;
  padding:8px 14px;
  border-radius:var(--radius);
  border:1px solid var(--amber-dim);
  background:transparent;
  color:var(--amber);
  transition:background .12s, color .12s;
  letter-spacing:.01em;
}
.btn:hover{background:var(--amber);color:var(--ink);}
.btn.primary{background:var(--amber);color:var(--ink);border-color:var(--amber);}
.btn.primary:hover{background:#eab671;}
.btn.subtle{border-color:var(--line);color:var(--text-dim);}
.btn.subtle:hover{border-color:var(--text-dim);color:var(--text);background:transparent;}
.btn.small{padding:5px 10px;font-size:11.5px;}
.btn.danger{border-color:var(--red);color:var(--red);}
.btn.danger:hover{background:var(--red);color:var(--ink);}

.content{flex:1;overflow-y:auto;padding:26px;}

/* ===== Dashboard ===== */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.stat-card{
  background:var(--panel);
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  padding:16px 18px;
  position:relative;
  overflow:hidden;
}
.stat-card .num{
  font-family:var(--font-display);
  font-size:32px;
  font-weight:600;
  color:var(--text);
  line-height:1;
}
.stat-card .label{
  font-family:var(--font-mono);
  font-size:10.5px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--text-faint);
  margin-top:8px;
}
.stat-card .accent-bar{position:absolute;left:0;top:0;bottom:0;width:3px;}

.section-title{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--text-faint);
  margin:30px 0 12px;
  display:flex;align-items:center;gap:10px;
}
.section-title::after{content:'';flex:1;height:1px;background:var(--line-soft);}
.section-title:first-child{margin-top:0;}

.dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;}

.timeline-item{
  display:flex;gap:12px;
  padding:10px 0;
  border-bottom:1px solid var(--line-soft);
}
.timeline-item:last-child{border-bottom:none;}
.timeline-item .tdot{width:6px;height:6px;border-radius:50%;margin-top:6px;flex-shrink:0;}
.timeline-item .body{flex:1;min-width:0;}
.timeline-item .title{font-size:13px;color:var(--text);}
.timeline-item .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);margin-top:2px;}

/* ===== Cards / Lists ===== */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.client-card, .project-card{
  background:var(--panel);
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  padding:16px;
  cursor:pointer;
  transition:border-color .12s, transform .12s;
}
.client-card:hover, .project-card:hover{border-color:var(--amber-dim);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.card-name{font-family:var(--font-display);font-size:16.5px;font-weight:600;}
.badge{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;
  padding:2px 7px;border-radius:2px;text-transform:uppercase;
  border:1px solid;
}
.badge.status-lead{color:var(--teal);border-color:var(--teal-dim);background:rgba(95,168,160,.08);}
.badge.status-active{color:var(--amber);border-color:var(--amber-dim);background:rgba(224,164,88,.08);}
.badge.status-closed{color:var(--text-faint);border-color:var(--line);background:transparent;}
.badge.status-paused{color:var(--red);border-color:var(--red);background:rgba(201,106,90,.08);}
.stage-not_contacted{color:var(--text-faint);}
.stage-follow_up_48h{color:var(--amber);}
.stage-loom_sent{color:var(--teal);}
.stage-replied{color:#7fb87a;}
.stage-booked_call{color:#7fb87a;}
.stage-no_response{color:var(--red);}
.stage-won{color:var(--amber);}
.stage-lost{color:var(--text-faint);}
.card-meta{font-size:12px;color:var(--text-dim);margin-bottom:4px;}
.card-meta .lbl{color:var(--text-faint);}
.card-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.tag{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);border:1px solid var(--line);padding:2px 6px;border-radius:2px;}
.progress-track{height:4px;background:var(--line-soft);border-radius:2px;margin-top:12px;overflow:hidden;}
.progress-fill{height:100%;background:var(--amber);}

/* ===== Leads table (spreadsheet-style) ===== */
.view-toggle{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);padding:2px;}
.view-toggle button{
  padding:6px 12px;font-size:11.5px;font-family:var(--font-mono);
  background:transparent;border:none;color:var(--text-faint);border-radius:2px;
}
.view-toggle button.active{background:var(--panel-2);color:var(--amber);}

.table-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:var(--radius);}
.leads-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1100px;}
.leads-table th{
  text-align:left;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-faint);padding:9px 12px;border-bottom:1px solid var(--line-soft);background:var(--panel);
  position:sticky;top:0;white-space:nowrap;
}
.leads-table td{padding:7px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;white-space:nowrap;}
.leads-table tr:hover td{background:var(--panel);}
.leads-table td.wrap{white-space:normal;min-width:160px;}
.leads-table a{color:var(--teal);}
.leads-table a:hover{text-decoration:underline;}
.cell-input{
  background:transparent;border:1px solid transparent;color:var(--text);
  padding:4px 6px;border-radius:2px;font-size:12.5px;width:100%;min-width:90px;
}
.cell-input:hover{border-color:var(--line);}
.cell-input:focus{outline:none;border-color:var(--amber-dim);background:var(--panel);}
.stage-select{
  font-family:var(--font-mono);font-size:11px;padding:5px 8px;border-radius:3px;
  border:1px solid var(--line);color:var(--text);cursor:pointer;
  appearance:none;-webkit-appearance:none;background:var(--panel) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%236c766d'/></svg>") no-repeat right 8px center;
  padding-right:22px;min-width:120px;
}
.mail-check{width:15px;height:15px;accent-color:var(--amber);cursor:pointer;}
.row-del{color:var(--text-faint);cursor:pointer;font-size:15px;}
.row-del:hover{color:var(--red);}
.import-hint{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);margin-bottom:14px;}

/* Empty state */
.empty-state{
  text-align:center;padding:60px 20px;color:var(--text-faint);
  border:1px dashed var(--line);border-radius:var(--radius);
}
.empty-state .glyph{font-size:28px;margin-bottom:10px;opacity:.5;font-family:var(--font-display);}
.empty-state .msg{font-size:13px;margin-bottom:16px;}

/* ===== Project detail ===== */
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.detail-title{font-family:var(--font-display);font-size:26px;font-weight:600;}
.detail-sub{font-size:12.5px;color:var(--text-dim);margin-top:4px;}
.tabs{display:flex;gap:2px;margin:20px 0;border-bottom:1px solid var(--line-soft);}
.tab{
  padding:9px 14px;font-size:12.5px;color:var(--text-faint);
  border-bottom:2px solid transparent;cursor:pointer;
  font-family:var(--font-mono);letter-spacing:.03em;
}
.tab:hover{color:var(--text-dim);}
.tab.active{color:var(--amber);border-bottom-color:var(--amber);}

.todo-group{margin-bottom:20px;}
.todo-group-title{font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.todo-row{
  display:flex;align-items:flex-start;gap:10px;
  padding:9px 10px;border-radius:var(--radius);
  border:1px solid transparent;
  transition:background .1s;
}
.todo-row:hover{background:var(--panel);border-color:var(--line-soft);}
.checkbox{
  width:16px;height:16px;border-radius:3px;border:1px solid var(--line);
  flex-shrink:0;margin-top:2px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,border-color .12s;
}
.checkbox.done{background:var(--amber);border-color:var(--amber);}
.checkbox svg{width:10px;height:10px;opacity:0;}
.checkbox.done svg{opacity:1;}
.todo-text{flex:1;font-size:13.5px;}
.todo-text.done{color:var(--text-faint);text-decoration:line-through;}
.todo-due{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);flex-shrink:0;margin-top:2px;}
.todo-due.overdue{color:var(--red);}
.todo-del{opacity:0;color:var(--text-faint);font-size:16px;line-height:1;padding:0 4px;}
.todo-row:hover .todo-del{opacity:1;}
.todo-del:hover{color:var(--red);}

.add-inline{display:flex;gap:8px;margin-top:8px;}
.add-inline input{
  flex:1;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:8px 10px;color:var(--text);font-size:13px;
}
.add-inline input:focus{outline:none;border-color:var(--amber-dim);}

.msg-item{
  border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;background:var(--panel);
}
.msg-item .msg-top{display:flex;justify-content:space-between;margin-bottom:6px;}
.msg-item .msg-title{font-weight:600;font-size:13.5px;}
.msg-item .msg-date{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);}
.msg-item .msg-body{font-size:13px;color:var(--text-dim);white-space:pre-wrap;}

.file-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:var(--radius);
  border:1px solid var(--line-soft);margin-bottom:8px;font-size:13px;
}
.file-item .fx{color:var(--teal);font-family:var(--font-mono);font-size:10px;border:1px solid var(--teal-dim);padding:2px 6px;border-radius:2px;}

/* ===== Modal ===== */
.overlay{
  position:fixed;inset:0;background:rgba(5,7,6,.7);
  display:none;align-items:center;justify-content:center;z-index:100;
  backdrop-filter:blur(2px);
}
.overlay.open{display:flex;}
.modal{
  background:var(--ink-2);border:1px solid var(--line);
  border-radius:6px;width:460px;max-width:92vw;
  max-height:86vh;overflow-y:auto;
  padding:24px;
}
.modal h2{font-family:var(--font-display);font-size:19px;margin-bottom:18px;font-weight:600;}
.field{margin-bottom:14px;}
.field label{
  display:block;font-family:var(--font-mono);font-size:10.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px;
}
.field input, .field select, .field textarea{
  width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:9px 11px;color:var(--text);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--amber-dim);}
.field textarea{resize:vertical;min-height:70px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}

/* Toast */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--panel-2);border:1px solid var(--amber-dim);
  color:var(--text);padding:10px 18px;border-radius:var(--radius);
  font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
  z-index:200;font-family:var(--font-mono);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.back-link{
  font-family:var(--font-mono);font-size:11px;color:var(--text-faint);
  margin-bottom:14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
}
.back-link:hover{color:var(--amber);}

@media (max-width:820px){
  .rail{display:none;}
  .sidebar{width:180px;}
  .stat-row{grid-template-columns:repeat(2,1fr);}
  .dash-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="shell">
  <!-- Sprocket rail: signature film-strip element -->
  <div class="rail">
    <div class="holes-col" id="railHolesTop"></div>
    <div class="brandmark">HISTREE&nbsp;&nbsp;STUDIOS</div>
    <div class="holes-col" id="railHolesBottom"></div>
  </div>

  <div class="sidebar">
    <div class="logo">Histree <em>HQ</em></div>
    <div class="tagline">Studio Operations</div>

    <div class="nav-group">
      <div class="nav-item active" data-view="dashboard">
        <span>Dashboard</span>
      </div>
      <div class="nav-item" data-view="clients">
        <span>Clients</span>
        <span class="count" id="navClientCount">0</span>
      </div>
      <div class="nav-item" data-view="projects">
        <span>Projects</span>
        <span class="count" id="navProjectCount">0</span>
      </div>
      <div class="nav-item" data-view="tasks">
        <span>My Tasks</span>
        <span class="count" id="navTaskCount">0</span>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-label">Pipeline</div>
      <div class="nav-item" data-view="clients" data-filter="lead">
        <span class="dot" style="background:var(--teal)"></span>
        <span>Leads</span>
        <span class="count" id="navLeadCount">0</span>
      </div>
      <div class="nav-item" data-view="projects" data-filter="active">
        <span class="dot" style="background:var(--amber)"></span>
        <span>Active work</span>
        <span class="count" id="navActiveCount">0</span>
      </div>
    </div>

    <div class="sidebar-foot">
      <button class="ghost-btn" id="exportBtn">↓ EXPORT BACKUP (.JSON)</button>
      <button class="ghost-btn" id="importBtn">↑ IMPORT BACKUP</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
  </div>

  <div class="main">
    <div class="topbar" id="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="topbar-spacer"></div>
      <div id="topbarActions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ Data layer ============ */
const DB_KEY = 'histree_hq_v1';

const STAGES = [
  {v:'not_contacted', l:'Not contacted'},
  {v:'follow_up_48h', l:'48h Follow up'},
  {v:'loom_sent', l:'Loom sent'},
  {v:'replied', l:'Replied'},
  {v:'booked_call', l:'Booked call'},
  {v:'no_response', l:'No response'},
  {v:'won', l:'Won'},
  {v:'lost', l:'Lost'},
];
function stageLabel(v){ const s = STAGES.find(x=>x.v===v); return s? s.l : 'Not contacted'; }

function clientDefaults(){
  return { studio:'', website:'', location:'', ig:'', pricing:'', mailSent:false, stage:'not_contacted', dateAdded: todayISO() };
}
function normalizeClient(c){
  return Object.assign(clientDefaults(), c);
}

function loadDB(){
  const raw = localStorage.getItem(DB_KEY);
  if(raw){
    try{
      const data = JSON.parse(raw);
      data.clients = (data.clients||[]).map(normalizeClient);
      data.projects = (data.projects||[]).map(p=> Object.assign({todos:[],messages:[],files:[]}, p));
      return data;
    }catch(e){}
  }
  const seeded = seedData();
  seeded.clients = seeded.clients.map(normalizeClient);
  return seeded;
}

      if(ext==='csv'){
        const rows = parseCSV(reader.result);
        importClientRows(rows);
        closeModal();
        return;

      const wb = XLSX.read(reader.result, {type:'binary'});

  else reader.readAsBinaryString(file);

async function importFromGoogleLink(){
  const url = document.getElementById('sheetLinkInput').value.trim();
  const statusEl = document.getElementById('linkImportStatus');
  const match = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if(!match){ statusEl.textContent = 'That doesn\'t look like a Google Sheets link.'; return; }
  const gidMatch = url.match(/[#&]gid=([0-9]+)/);
  const gid = gidMatch ? gidMatch[1] : '0';
  const exportUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv&gid=${gid}`;
  statusEl.textContent = 'Fetching…';
  try{
    const res = await fetch(exportUrl);
    if(!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    if(text.trim().startsWith('<')) throw new Error('not shared publicly');
    const rows = parseCSV(text);
    importClientRows(rows);
    closeModal();
  }catch(err){
    statusEl.innerHTML = `Couldn't fetch that sheet — it needs to be shared as "Anyone with the link can view." <br>Alternative: File → Download → CSV in Google Sheets, then use the "Upload file" tab.`;
  }
}
window.importFromGoogleLink = importFromGoogleLink;

function parseCSV(text){ return parseDelimited(text, ','); }

function parseDelimited(text, delim){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return [];
  const splitLine = (line)=>{
    if(delim==='\t') return line.split('\t');
    const out=[]; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(ch==='"'){ if(inQ && line[i+1]==='"'){ cur+='"'; i++; } else inQ=!inQ; }
      else if(ch===',' && !inQ){ out.push(cur); cur=''; }
      else cur+=ch;
    }
    out.push(cur); return out;
  };
  const headers = splitLine(lines[0]).map(h=>h.trim());
  return lines.slice(1).map(line=>{
    const cells = splitLine(line);
    const row = {};
    headers.forEach((h,i)=> row[h] = (cells[i]||'').trim());
    return row;
  });
}

function findCol(row, candidates){
  const keys = Object.keys(row);
  for(const cand of candidates){
    const hit = keys.find(k=> k.toLowerCase().replace(/[^a-z]/g,'') === cand.toLowerCase().replace(/[^a-z]/g,''));
    if(hit) return row[hit];
  }
  return '';
}

function importClientRows(rows){
  if(!rows || !rows.length){ showToast('No rows found in that file'); return; }
  let added = 0, skipped = 0;
  rows.forEach(row=>{
    const name = findCol(row, ['Name']);
    const studio = findCol(row, ['Studios Name','Studio Name','Studio','Agency Name','Agency','Podcast Name','Channel Name']);
    const label = (name || studio || '').toString().trim();
    if(!label){ skipped++; return; }
    const email = findCol(row, ['Email']);
    const website = findCol(row, ['Website','Channel','Youtube','YouTube']);
    const location = findCol(row, ['Location']);
    const ig = findCol(row, ['IG','Instagram']);
    const pricing = findCol(row, ['Pricings','Pricing']);
    const mailRaw = findCol(row, ['Mail']);
    const statusRaw = (findCol(row, ['Status','Status 2'])||'').toString().trim().toLowerCase();
    const dateRaw = findCol(row, ['Date']);
    const noteRaw = findCol(row, ['1 Content Note','Content Note','1 Personal Note','Personal Note','Note','Notes']);

    let stage = 'not_contacted';
    if(/loom/.test(statusRaw)) stage = 'loom_sent';
    else if(/48h|follow/.test(statusRaw)) stage = 'follow_up_48h';
    else if(/repl/.test(statusRaw)) stage = 'replied';
    else if(/book/.test(statusRaw)) stage = 'booked_call';
    else if(/won/.test(statusRaw)) stage = 'won';
    else if(/lost|declin/.test(statusRaw)) stage = 'lost';
    else if(/no response|ghost/.test(statusRaw)) stage = 'no_response';

    const already = DB.clients.find(c=> (email && c.email===email) || (c.name===label && c.studio===studio));
    const data = {
      name: label,
      contact: name && studio ? name : '',
      email: (email||'').toString(),
      platform: 'Imported sheet',
      status: 'lead',
      value: 0,
      notes: noteRaw ? String(noteRaw) : (already ? already.notes : ''),
      studio: (studio||'').toString(),
      website: (website||'').toString(),
      location: (location||'').toString(),
      ig: (ig||'').toString(),
      pricing: (pricing||'').toString(),
      mailSent: /^(true|1|yes|x|✓)$/i.test((mailRaw||'').toString().trim()),
      stage,
      dateAdded: dateRaw ? String(dateRaw) : todayISO(),
    };
    if(already){
      Object.assign(already, data, {id:already.id, createdAt:already.createdAt});
    } else {
      DB.clients.push(normalizeClient({id:uid(), createdAt:todayISO(), ...data}));
      added++;
    }
  });
  saveDB();
  showToast(`Imported ${added} new lead${added!==1?'s':''}${rows.length-added-skipped>0? `, updated ${rows.length-added-skipped}`:''}${skipped>0? `, skipped ${skipped} blank row${skipped!==1?'s':''}`:''}`);
  clientsViewMode = 'table';
  setView('clients');
}

    </div>
    <div class="section-title">Notes</div>
    <div style="font-size:13px;color:var(--text-dim);white-space:pre-wrap;line-height:1.7">${escapeHtml(c.notes||'No notes yet.')}</div>
    <div class="section-title">Projects</div>
    ${projects.length ? `<div class="card-grid">${projects.map(p=>renderProjectCardHTML(p)).join('')}</div>` : `<div class="empty-state"><div class="msg">No projects linked to this client yet.</div><button class="btn primary" onclick="openProjectModal(null,'${c.id}')">+ New Project</button></div>`}
    ${projects.length ? `<div style="margin-top:14px"><button class="btn subtle small" onclick="openProjectModal(null,'${c.id}')">+ Add project for this client</button></div>` : ''}
  `;
}

/* ============ Projects ============ */
function renderProjectCardHTML(p){
  const client = DB.clients.find(c=>c.id===p.clientId);
  const prog = projectProgress(p);
  return `
    <div class="project-card" onclick="openProjectDetail('${p.id}')">
      <div class="card-top">
        <div class="card-name">${escapeHtml(p.name)}</div>
        <span class="badge status-${p.status}">${p.status}</span>
      </div>
      <div class="card-meta"><span class="lbl">Client —</span> ${escapeHtml(client? client.name : '—')}</div>
      <div class="card-meta"><span class="lbl">Due —</span> ${fmtDate(p.dueDate)}</div>
      <div class="card-meta"><span class="lbl">Tasks —</span> ${p.todos.filter(t=>t.done).length}/${p.todos.length} done</div>
      <div class="progress-track"><div class="progress-fill" style="width:${prog}%"></div></div>
    </div>`;
}

function renderProjects(){
  pageTitle.textContent = 'Projects';
  topbarActions.innerHTML = `<button class="btn primary" id="addProjectBtn">+ New Project</button>`;
  document.getElementById('addProjectBtn').onclick = ()=> openProjectModal();

  let list = DB.projects;
  if(state.filter) list = list.filter(p=>p.status===state.filter);

  if(!list.length){
    content.innerHTML = `<div class="empty-state"><div class="glyph">＋</div><div class="msg">No projects yet. Spin one up for a client.</div><button class="btn primary" onclick="openProjectModal()">+ New Project</button></div>`;
    return;
  }
  content.innerHTML = `<div class="card-grid">${list.map(renderProjectCardHTML).join('')}</div>`;
}

function openProjectDetail(id){
  state.activeProjectId = id; state.projectTab = 'todos';
  setView('projectDetail');
}
function openClientDetail(id){
  state.activeClientId = id;
  setView('clientDetail');
}
window.openProjectDetail = openProjectDetail;
window.openClientDetail = openClientDetail;

function renderProjectDetail(){
  const p = DB.projects.find(x=>x.id===state.activeProjectId);
  if(!p){ setView('projects'); return; }
  const client = DB.clients.find(c=>c.id===p.clientId);
  pageTitle.textContent = p.name;
  topbarActions.innerHTML = `
    <button class="btn subtle small" onclick="openProjectModal('${p.id}')">Edit</button>
    <button class="btn danger small" onclick="deleteProject('${p.id}')">Delete</button>
  `;

  const prog = projectProgress(p);

  content.innerHTML = `
    <div class="back-link" onclick="setView('projects')">← All projects</div>
    <div class="detail-header">
      <div>
        <div class="detail-title">${escapeHtml(p.name)}</div>
        <div class="detail-sub">${client? escapeHtml(client.name) : 'No client linked'} · <span class="badge status-${p.status}">${p.status}</span> · due ${fmtDate(p.dueDate)}</div>
      </div>
      <div style="text-align:right;min-width:140px">
        <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-bottom:4px">${prog}% complete</div>
        <div class="progress-track"><div class="progress-fill" style="width:${prog}%"></div></div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab ${state.projectTab==='todos'?'active':''}" onclick="switchProjectTab('todos')">To-dos</div>
      <div class="tab ${state.projectTab==='messages'?'active':''}" onclick="switchProjectTab('messages')">Notes</div>
      <div class="tab ${state.projectTab==='files'?'active':''}" onclick="switchProjectTab('files')">Files</div>
    </div>

    <div id="projectTabContent"></div>
  `;
  renderProjectTabContent(p);
}

function switchProjectTab(tab){ state.projectTab = tab; renderProjectDetail(); }
window.switchProjectTab = switchProjectTab;

function renderProjectTabContent(p){
  const el = document.getElementById('projectTabContent');
  if(state.projectTab==='todos'){
    const open = p.todos.filter(t=>!t.done);
    const done = p.todos.filter(t=>t.done);
    el.innerHTML = `
      <div class="todo-group">
        <div class="todo-group-title">To do <span style="color:var(--text-faint);font-weight:400">(${open.length})</span></div>
        ${open.map(t=>todoRowHTML(p.id,t)).join('') || '<div style="color:var(--text-faint);font-size:13px;padding:6px 0">All clear.</div>'}
        <div class="add-inline">
          <input type="text" id="newTodoInput" placeholder="Add a to-do and press Enter…">
        </div>
      </div>
      ${done.length ? `<div class="todo-group">
        <div class="todo-group-title">Done <span style="color:var(--text-faint);font-weight:400">(${done.length})</span></div>
        ${done.map(t=>todoRowHTML(p.id,t)).join('')}
      </div>` : ''}
    `;
    const input = document.getElementById('newTodoInput');
    input.addEventListener('keydown', e=>{
      if(e.key==='Enter' && input.value.trim()){
        p.todos.push({id:uid(), text:input.value.trim(), done:false, due:null});
        saveDB(); renderProjectDetail(); updateNavCounts();
      }
    });
  } else if(state.projectTab==='messages'){
    el.innerHTML = `
      <div class="add-inline" style="flex-direction:column;align-items:stretch;gap:8px;margin-bottom:16px">
        <input type="text" id="msgTitleInput" placeholder="Note title…">
        <textarea id="msgBodyInput" placeholder="Write an update, decision, or client note…" rows="3" style="background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;color:var(--text)"></textarea>
        <button class="btn primary small" style="align-self:flex-end" onclick="addMessage('${p.id}')">Post note</button>
      </div>
      ${p.messages.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`
        <div class="msg-item">
          <div class="msg-top"><div class="msg-title">${escapeHtml(m.title)}</div><div class="msg-date">${fmtDate(m.date)}</div></div>
          <div class="msg-body">${escapeHtml(m.body)}</div>
        </div>`).join('') || '<div class="empty-state"><div class="msg">No notes yet on this project.</div></div>'}
    `;
  } else if(state.projectTab==='files'){
    el.innerHTML = `
      <div class="add-inline">
        <input type="text" id="fileNameInput" placeholder="File name or link (e.g. Ep42_Final.mp4 or Drive URL)…">
        <button class="btn primary small" onclick="addFile('${p.id}')">Add</button>
      </div>
      <div style="margin-top:14px">
        ${p.files.map(f=>`
          <div class="file-item">
            <span class="fx">FILE</span>
            <span style="flex:1">${escapeHtml(f.name)}</span>
            <span style="color:var(--text-faint);font-family:var(--font-mono);font-size:10.5px">${fmtDateShort(f.date)}</span>
            <span class="todo-del" style="opacity:1" onclick="removeFile('${p.id}','${f.id}')">×</span>
          </div>`).join('') || '<div class="empty-state"><div class="msg">No files logged. Track deliverable names or drive links here.</div></div>'}
      </div>
    `;
  }
}

function todoRowHTML(projectId, t){
  const overdue = t.due && !t.done && t.due < todayISO();
  return `
    <div class="todo-row">
      <div class="checkbox ${t.done?'done':''}" onclick="toggleTodo('${projectId}','${t.id}')">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#0e1210" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="todo-text ${t.done?'done':''}">${escapeHtml(t.text)}</div>
      ${t.due ? `<div class="todo-due ${overdue?'overdue':''}">${fmtDateShort(t.due)}</div>` : ''}
      <div class="todo-del" onclick="deleteTodo('${projectId}','${t.id}')">×</div>
    </div>`;
}

function toggleTodo(pid, tid){
  const p = DB.projects.find(x=>x.id===pid);
  const t = p.todos.find(x=>x.id===tid);
  t.done = !t.done;
  saveDB(); renderProjectDetail(); updateNavCounts();
}
function deleteTodo(pid, tid){
  const p = DB.projects.find(x=>x.id===pid);
  p.todos = p.todos.filter(x=>x.id!==tid);
  saveDB(); renderProjectDetail(); updateNavCounts();
}
function addMessage(pid){
  const title = document.getElementById('msgTitleInput').value.trim();
  const body = document.getElementById('msgBodyInput').value.trim();
  if(!title && !body) return;
  const p = DB.projects.find(x=>x.id===pid);
  p.messages.push({id:uid(), title: title||'Untitled note', body, date: todayISO()});
  saveDB(); renderProjectDetail();
}
function addFile(pid){
  const input = document.getElementById('fileNameInput');
  if(!input.value.trim()) return;
  const p = DB.projects.find(x=>x.id===pid);
  p.files.push({id:uid(), name: input.value.trim(), date: todayISO()});
  saveDB(); renderProjectDetail();
}
function removeFile(pid, fid){
  const p = DB.projects.find(x=>x.id===pid);
  p.files = p.files.filter(f=>f.id!==fid);
  saveDB(); renderProjectDetail();
}
window.toggleTodo=toggleTodo; window.deleteTodo=deleteTodo;
window.addMessage=addMessage; window.addFile=addFile; window.removeFile=removeFile;

/* ============ My Tasks (cross-project) ============ */
function renderTasks(){
  pageTitle.textContent = 'My Tasks';
  const rows = DB.projects.flatMap(p=> p.todos.filter(t=>!t.done).map(t=>({...t, projectId:p.id, projectName:p.name})));
  rows.sort((a,b)=> (a.due||'9999').localeCompare(b.due||'9999'));
  content.innerHTML = rows.length ? rows.map(t=>{
    const overdue = t.due && t.due < todayISO();
    return `
    <div class="todo-row" style="border:1px solid var(--line-soft);border-radius:var(--radius);margin-bottom:8px;padding:11px 12px">
      <div class="checkbox" onclick="toggleTodo('${t.projectId}','${t.id}');renderTasks()"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#0e1210" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="todo-text" style="flex:1">${escapeHtml(t.text)}<div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);margin-top:3px">${escapeHtml(t.projectName)}</div></div>
      ${t.due ? `<div class="todo-due ${overdue?'overdue':''}">${fmtDateShort(t.due)}</div>` : ''}
    </div>`;
  }).join('') : `<div class="empty-state"><div class="glyph">✓</div><div class="msg">No open tasks across any project.</div></div>`;
}

/* ============ Modals ============ */
const overlay = document.getElementById('overlay');
const modalBody = document.getElementById('modalBody');
function closeModal(){ overlay.classList.remove('open'); modalBody.innerHTML=''; }
window.closeModal = closeModal;
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

function openClientModal(id=null){
  const editing = id ? DB.clients.find(c=>c.id===id) : null;
  modalBody.innerHTML = `
    <h2>${editing? 'Edit Client' : 'New Client'}</h2>
    <div class="field"><label>Name / Company</label><input id="f_name" value="${editing?escapeAttr(editing.name):''}" placeholder="e.g. Podcafe"></div>
    <div class="field-row">
      <div class="field"><label>Contact person</label><input id="f_contact" value="${editing?escapeAttr(editing.contact||''):''}"></div>
      <div class="field"><label>Email</label><input id="f_email" value="${editing?escapeAttr(editing.email||''):''}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Source</label><input id="f_platform" placeholder="Upwork, Instagram DM…" value="${editing?escapeAttr(editing.platform||''):''}"></div>
      <div class="field"><label>Value ($/mo)</label><input id="f_value" type="number" value="${editing?editing.value||0:''}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Status</label>
        <select id="f_status">
          <option value="lead" ${editing&&editing.status==='lead'?'selected':''}>Lead</option>
          <option value="active" ${editing&&editing.status==='active'?'selected':''}>Active</option>
          <option value="paused" ${editing&&editing.status==='paused'?'selected':''}>Paused</option>
          <option value="closed" ${editing&&editing.status==='closed'?'selected':''}>Closed</option>
        </select>
      </div>
      <div class="field"><label>Outreach stage</label>
        <select id="f_stage">
          ${STAGES.map(s=>`<option value="${s.v}" ${editing&&editing.stage===s.v?'selected':''}>${s.l}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Studio name</label><input id="f_studio" value="${editing?escapeAttr(editing.studio||''):''}"></div>
      <div class="field"><label>Location</label><input id="f_location" value="${editing?escapeAttr(editing.location||''):''}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Website</label><input id="f_website" placeholder="https://…" value="${editing?escapeAttr(editing.website||''):''}"></div>
      <div class="field"><label>Instagram</label><input id="f_ig" placeholder="https://instagram.com/…" value="${editing?escapeAttr(editing.ig||''):''}"></div>
    </div>
    <div class="field"><label>Pricing link</label><input id="f_pricing" placeholder="https://…" value="${editing?escapeAttr(editing.pricing||''):''}"></div>
    <div class="field"><label>Notes</label><textarea id="f_notes">${editing?escapeHtml(editing.notes||''):''}</textarea></div>
    <div class="modal-actions">
      <button class="btn subtle" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="saveClient(${editing?`'${editing.id}'`:'null'})">${editing?'Save changes':'Add client'}</button>
    </div>
  `;
  overlay.classList.add('open');
}
window.openClientModal = openClientModal;

function saveClient(id){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ showToast('Name is required'); return; }
  const data = {
    name,
    contact: document.getElementById('f_contact').value.trim(),
    email: document.getElementById('f_email').value.trim(),
    platform: document.getElementById('f_platform').value.trim(),
    value: parseFloat(document.getElementById('f_value').value)||0,
    status: document.getElementById('f_status').value,
    stage: document.getElementById('f_stage').value,
    studio: document.getElementById('f_studio').value.trim(),
    location: document.getElementById('f_location').value.trim(),
    website: document.getElementById('f_website').value.trim(),
    ig: document.getElementById('f_ig').value.trim(),
    pricing: document.getElementById('f_pricing').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
  };
  if(id){
    Object.assign(DB.clients.find(c=>c.id===id), data);
  } else {
    DB.clients.push(normalizeClient({id:uid(), createdAt:todayISO(), dateAdded:todayISO(), ...data}));
  }
  saveDB(); closeModal(); showToast(id?'Client updated':'Client added');
  render();
}
window.saveClient = saveClient;

function deleteClient(id){
  if(!confirm('Delete this client? Linked projects will remain but become unassigned.')) return;
  DB.clients = DB.clients.filter(c=>c.id!==id);
  DB.projects.forEach(p=>{ if(p.clientId===id) p.clientId=null; });
  saveDB(); setView('clients'); showToast('Client deleted');
}
window.deleteClient = deleteClient;

function openProjectModal(id=null, presetClientId=null){
  const editing = id ? DB.projects.find(p=>p.id===id) : null;
  const clientOptions = DB.clients.map(c=>`<option value="${c.id}" ${(editing&&editing.clientId===c.id)||presetClientId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('');
  modalBody.innerHTML = `
    <h2>${editing?'Edit Project':'New Project'}</h2>
    <div class="field"><label>Project name</label><input id="f_pname" value="${editing?escapeAttr(editing.name):''}" placeholder="e.g. Podcafe — Weekly Episode Edit"></div>
    <div class="field"><label>Client</label><select id="f_pclient"><option value="">— None —</option>${clientOptions}</select></div>
    <div class="field-row">
      <div class="field"><label>Status</label>
        <select id="f_pstatus">
          <option value="lead" ${editing&&editing.status==='lead'?'selected':''}>Lead</option>
          <option value="active" ${editing&&editing.status==='active'?'selected':''}>Active</option>
          <option value="paused" ${editing&&editing.status==='paused'?'selected':''}>Paused</option>
          <option value="closed" ${editing&&editing.status==='closed'?'selected':''}>Closed</option>
        </select>
      </div>
      <div class="field"><label>Due date</label><input id="f_pdue" type="date" value="${editing?editing.dueDate||'':''}"></div>
    </div>
    <div class="field"><label>Budget ($)</label><input id="f_pbudget" type="number" value="${editing?editing.budget||0:''}"></div>
    <div class="modal-actions">
      <button class="btn subtle" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="saveProject(${editing?`'${editing.id}'`:'null'})">${editing?'Save changes':'Create project'}</button>
    </div>
  `;
  overlay.classList.add('open');
}
window.openProjectModal = openProjectModal;

function saveProject(id){
  const name = document.getElementById('f_pname').value.trim();
  if(!name){ showToast('Project name is required'); return; }
  const data = {
    name,
    clientId: document.getElementById('f_pclient').value || null,
    status: document.getElementById('f_pstatus').value,
    dueDate: document.getElementById('f_pdue').value || null,
    budget: parseFloat(document.getElementById('f_pbudget').value)||0,
  };
  if(id){
    Object.assign(DB.projects.find(p=>p.id===id), data);
  } else {
    DB.projects.push({id:uid(), todos:[], messages:[], files:[], ...data});
  }
  saveDB(); closeModal(); showToast(id?'Project updated':'Project created');
  render();
}
window.saveProject = saveProject;

function deleteProject(id){
  if(!confirm('Delete this project and all its tasks/notes? This can\'t be undone.')) return;
  DB.projects = DB.projects.filter(p=>p.id!==id);
  saveDB(); setView('projects'); showToast('Project deleted');
}
window.deleteProject = deleteProject;

/* ============ Utilities ============ */
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str).replace(/`/g,'&#96;'); }

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* Export / Import */
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `histree-hq-backup-${todayISO()}.json`;
  a.click(); URL.revokeObjectURL(url);
  showToast('Backup downloaded');
});
document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.clients || !data.projects) throw new Error('bad shape');
      if(confirm('This will replace your current data with the imported backup. Continue?')){
        DB = data; saveDB(); setView('dashboard'); showToast('Backup imported');
      }
    }catch(err){ showToast('Could not read that file'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* Rail sprocket holes — decorative, generated for full-height coverage */
function buildRailHoles(){
  const count = Math.max(4, Math.floor((window.innerHeight - 140) / 60 / 2));
  document.getElementById('railHolesTop').innerHTML = '<div class="hole"></div>'.repeat(count);
  document.getElementById('railHolesBottom').innerHTML = '<div class="hole"></div>'.repeat(count);
}
buildRailHoles();
window.addEventListener('resize', buildRailHoles);

/* ============ Init ============ */
render();
</script>
</body>
