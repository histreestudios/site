<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histree HQ — Studio Ops</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#1c1c1e;
  --ink-2:rgba(28,28,30,.78);
  --panel:#2c2c2e;
  --panel-2:#242426;
  --line:#3a3a3c;
  --line-soft:#333335;
  --text:#f2f2f7;
  --text-dim:#a1a1a6;
  --text-faint:#7c7c80;
  --blue:#0a84ff;
  --blue-dim:rgba(10,132,255,.4);
  --blue-wash:rgba(10,132,255,.14);
  --teal:#40c8e0;
  --teal-dim:rgba(64,200,224,.4);
  --green:#30d158;
  --orange:#ff9f0a;
  --red:#ff453a;
  --font-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif;
  --font-mono:ui-monospace,'SF Mono','IBM Plex Mono',Menlo,monospace;
  --radius:10px;
  --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.24);
  --shadow-md:0 2px 12px rgba(0,0,0,.32);
  --shadow-lg:0 16px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--ink);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;font-size:14px;}
::selection{background:var(--blue-dim);color:var(--text);}

::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#48484a;border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:#5a5a5c;}

/* ===== Layout shell ===== */
.shell{display:flex;height:100vh;overflow:hidden;}

/* Sidebar — Apple Finder / Mail style */
.sidebar{
  width:250px;
  flex-shrink:0;
  height:100vh;
  background:var(--ink-2);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-right:1px solid var(--line);
  padding:20px 14px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.sidebar-scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  margin:0 -14px;
  padding:0 14px;
}
.sidebar-scroll::-webkit-scrollbar{width:0;height:0;}
.logo{
  font-family:var(--font-display);
  font-weight:700;
  font-size:19px;
  letter-spacing:-0.01em;
  color:var(--text);
  margin-bottom:2px;
  padding:0 8px;
}
.logo em{font-style:normal;color:var(--blue);}
.tagline{
  font-size:11.5px;
  color:var(--text-faint);
  letter-spacing:0.01em;
  margin-bottom:22px;
  padding:0 8px;
}
.nav-group{margin-bottom:18px;}
.nav-label{
  display:flex;align-items:center;justify-content:space-between;
  font-size:11px;
  font-weight:600;
  letter-spacing:.02em;
  text-transform:uppercase;
  color:var(--text-faint);
  margin-bottom:6px;
  padding:0 8px;
}
.nav-label .add-mini{
  font-size:14px;color:var(--text-faint);cursor:pointer;line-height:1;padding:0 3px;border-radius:4px;
}
.nav-label .add-mini:hover{color:var(--blue);background:var(--blue-wash);}
.nav-item{
  display:flex;align-items:center;gap:9px;
  padding:7px 9px;
  border-radius:8px;
  color:var(--text);
  font-size:13.5px;
  cursor:pointer;
  transition:background .12s, color .12s;
}
.nav-item .icon{font-size:14px;width:16px;text-align:center;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(0,0,0,.04);}
.nav-item.active{background:var(--blue);color:#fff;}
.nav-item.active .count{color:rgba(255,255,255,.85);}
.nav-item.active .icon{opacity:1;}
.nav-item .count{
  margin-left:auto;
  font-size:11.5px;
  color:var(--text-faint);
}
.nav-item .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.nav-item .folder-del{opacity:0;margin-left:4px;color:var(--text-faint);font-size:13px;}
.nav-item:hover .folder-del{opacity:1;}
.nav-item.active .folder-del{color:rgba(255,255,255,.8);}
.folder-del:hover{color:var(--red)!important;}

.sidebar-foot{
  margin-top:auto;
  padding-top:14px;
  border-top:1px solid var(--line);
  display:flex;
  flex-direction:column;
  gap:6px;
}
.ghost-btn{
  font-size:11.5px;
  letter-spacing:.01em;
  color:var(--text-dim);
  background:var(--panel-2);border:1px solid var(--line);
  padding:8px 10px;border-radius:8px;
  text-align:left;
  transition:border-color .12s,color .12s,background .12s;
}
.ghost-btn:hover{border-color:var(--blue-dim);color:var(--blue);background:var(--blue-wash);}
.hosting-note{
  font-size:10.5px;color:var(--text-faint);line-height:1.5;padding:2px 8px 6px;
}
.hosting-note b{color:var(--text-dim);}

/* Main */
.main{flex:1;min-width:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.topbar{
  height:58px;flex-shrink:0;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;
  padding:0 28px;
  gap:16px;
  background:rgba(28,28,30,.85);
  backdrop-filter:saturate(180%) blur(16px);
  position:sticky;top:0;z-index:5;
}
.topbar h1{
  font-family:var(--font-display);
  font-weight:700;
  font-size:19px;
  letter-spacing:-0.01em;
}
.topbar .sub{
  font-size:11.5px;
  color:var(--text-faint);
}
.topbar-spacer{flex:1;}
.btn{
  font-size:13px;
  font-weight:600;
  padding:8px 15px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  transition:background .12s, color .12s, border-color .12s, transform .06s;
  letter-spacing:.01em;
}
.btn:hover{background:var(--panel-2);}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn.primary:hover{background:#0077ed;}
.btn.subtle{border-color:var(--line);color:var(--text-dim);background:transparent;}
.btn.subtle:hover{border-color:var(--text-dim);color:var(--text);background:var(--panel-2);}
.btn.small{padding:5px 12px;font-size:12px;}
.btn.danger{border-color:var(--red);color:var(--red);background:transparent;}
.btn.danger:hover{background:var(--red);color:#fff;}

.content{flex:1;overflow-y:auto;padding:28px;}

/* ===== Dashboard ===== */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px;}
.stat-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:18px 20px;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.stat-card .num{
  font-family:var(--font-display);
  font-size:30px;
  font-weight:700;
  color:var(--text);
  line-height:1;
  letter-spacing:-0.01em;
}
.stat-card .label{
  font-size:11.5px;
  font-weight:500;
  letter-spacing:.01em;
  color:var(--text-faint);
  margin-top:8px;
}
.stat-card .accent-bar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:0 3px 3px 0;}

.section-title{
  font-size:12px;
  font-weight:600;
  letter-spacing:.02em;
  text-transform:uppercase;
  color:var(--text-faint);
  margin:32px 0 12px;
  display:flex;align-items:center;gap:10px;
}
.section-title::after{content:'';flex:1;height:1px;background:var(--line);}
.section-title:first-child{margin-top:0;}

.dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;}

.timeline-item{
  display:flex;gap:12px;
  padding:11px 4px;
  border-bottom:1px solid var(--line-soft);
}
.timeline-item:last-child{border-bottom:none;}
.timeline-item .tdot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex-shrink:0;}
.timeline-item .body{flex:1;min-width:0;}
.timeline-item .title{font-size:13.5px;color:var(--text);}
.timeline-item .meta{font-size:11.5px;color:var(--text-faint);margin-top:2px;}

/* ===== Cards / Lists ===== */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.client-card, .project-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:18px;
  cursor:pointer;
  transition:border-color .12s, box-shadow .12s, transform .1s;
  box-shadow:var(--shadow-sm);
}
.client-card:hover, .project-card:hover{border-color:var(--blue-dim);box-shadow:var(--shadow-md);transform:translateY(-1px);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.card-name{font-family:var(--font-display);font-size:16px;font-weight:600;}
.badge{
  font-size:10.5px;font-weight:600;letter-spacing:.02em;
  padding:3px 9px;border-radius:20px;text-transform:capitalize;
  border:1px solid;
}
.badge.status-lead{color:var(--teal);border-color:var(--teal-dim);background:rgba(50,173,230,.08);}
.badge.status-active{color:var(--blue);border-color:var(--blue-dim);background:var(--blue-wash);}
.badge.status-closed{color:var(--text-faint);border-color:var(--line);background:transparent;}
.badge.status-paused{color:var(--orange);border-color:rgba(255,149,0,.35);background:rgba(255,149,0,.08);}
.stage-not_contacted{color:var(--text-faint);}
.stage-follow_up_48h{color:var(--orange);}
.stage-loom_sent{color:var(--teal);}
.stage-replied{color:var(--green);}
.stage-booked_call{color:var(--green);}
.stage-no_response{color:var(--red);}
.stage-won{color:var(--blue);}
.stage-lost{color:var(--text-faint);}
.card-meta{font-size:12.5px;color:var(--text-dim);margin-bottom:4px;}
.card-meta .lbl{color:var(--text-faint);}
.card-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.tag{font-size:10.5px;color:var(--text-dim);background:var(--panel-2);border:1px solid var(--line);padding:3px 8px;border-radius:20px;}
.progress-track{height:5px;background:var(--line-soft);border-radius:3px;margin-top:12px;overflow:hidden;}
.progress-fill{height:100%;background:var(--blue);border-radius:3px;}

/* ===== Leads table (spreadsheet-style, resizable columns) ===== */
.view-toggle{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:2px;}
.view-toggle button{
  padding:6px 14px;font-size:12px;font-weight:500;
  background:transparent;border:none;color:var(--text-faint);border-radius:18px;
}
.view-toggle button.active{background:var(--panel);color:var(--blue);box-shadow:var(--shadow-sm);}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--panel);box-shadow:var(--shadow-sm);}
.leads-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:1100px;table-layout:fixed;}
.leads-table th{
  text-align:left;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;
  color:var(--text-faint);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);
  position:sticky;top:0;white-space:nowrap;position:relative;user-select:none;overflow:hidden;
}
.leads-table th:first-child{border-radius:var(--radius-lg) 0 0 0;}
.leads-table td{padding:8px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.leads-table tr:hover td{background:rgba(0,113,227,.03);}
.leads-table td.wrap{white-space:normal;min-width:160px;}
.leads-table a{color:var(--blue);}
.leads-table a:hover{text-decoration:underline;}
.col-resize-handle{
  position:absolute;top:0;right:0;bottom:0;width:7px;cursor:col-resize;
  z-index:2;
}
.col-resize-handle::after{
  content:'';position:absolute;right:2px;top:20%;bottom:20%;width:2px;
  background:var(--line);border-radius:1px;opacity:0;transition:opacity .12s;
}
.col-resize-handle:hover::after,.col-resize-handle.active::after{opacity:1;background:var(--blue);}
.cell-input{
  background:transparent;border:1px solid transparent;color:var(--text);
  padding:5px 7px;border-radius:6px;font-size:12.5px;width:100%;min-width:70px;
}
.cell-input:hover{border-color:var(--line);}
.cell-input:focus{outline:none;border-color:var(--blue-dim);background:var(--panel-2);}
.stage-select{
  font-size:11.5px;padding:5px 8px;border-radius:16px;
  border:1px solid var(--line);color:var(--text);cursor:pointer;
  appearance:none;-webkit-appearance:none;background:var(--panel-2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23a1a1a6'/></svg>") no-repeat right 8px center;
  padding-right:22px;min-width:120px;max-width:100%;
}
.mail-check{width:15px;height:15px;accent-color:var(--blue);cursor:pointer;}
.row-del{color:var(--text-faint);cursor:pointer;font-size:16px;text-align:center;}
.row-del:hover{color:var(--red);}
.import-hint{font-size:11.5px;color:var(--text-faint);margin-bottom:14px;line-height:1.5;}

/* Folder pill on table */
.folder-pill{
  font-size:11px;font-weight:500;color:var(--blue);background:var(--blue-wash);
  border:1px solid var(--blue-dim);padding:3px 10px;border-radius:14px;display:inline-flex;align-items:center;gap:5px;
}

/* Empty state */
.empty-state{
  text-align:center;padding:60px 20px;color:var(--text-faint);
  border:1.5px dashed var(--line);border-radius:var(--radius-lg);background:var(--panel);
}
.empty-state .glyph{font-size:30px;margin-bottom:10px;opacity:.5;font-family:var(--font-display);}
.empty-state .msg{font-size:13.5px;margin-bottom:16px;}

/* ===== Project detail ===== */
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.detail-title{font-family:var(--font-display);font-size:25px;font-weight:700;letter-spacing:-.01em;}
.detail-sub{font-size:12.5px;color:var(--text-dim);margin-top:4px;}
.tabs{display:flex;gap:4px;margin:20px 0;border-bottom:1px solid var(--line);}
.tab{
  padding:9px 14px;font-size:13px;font-weight:500;color:var(--text-faint);
  border-bottom:2px solid transparent;cursor:pointer;
  letter-spacing:.01em;
}
.tab:hover{color:var(--text-dim);}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}

.todo-group{margin-bottom:20px;}
.todo-group-title{font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.todo-row{
  display:flex;align-items:flex-start;gap:10px;
  padding:9px 10px;border-radius:10px;
  border:1px solid transparent;
  transition:background .1s;
}
.todo-row:hover{background:var(--panel-2);border-color:var(--line-soft);}
.checkbox{
  width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);
  flex-shrink:0;margin-top:2px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,border-color .12s;
}
.checkbox.done{background:var(--blue);border-color:var(--blue);}
.checkbox svg{width:11px;height:11px;opacity:0;}
.checkbox.done svg{opacity:1;}
.todo-text{flex:1;font-size:13.5px;}
.todo-text.done{color:var(--text-faint);text-decoration:line-through;}
.todo-due{font-size:11px;color:var(--text-faint);flex-shrink:0;margin-top:2px;}
.todo-due.overdue{color:var(--red);}
.todo-del{opacity:0;color:var(--text-faint);font-size:17px;line-height:1;padding:0 4px;}
.todo-row:hover .todo-del{opacity:1;}
.todo-del:hover{color:var(--red);}

.add-inline{display:flex;gap:8px;margin-top:8px;}
.add-inline input{
  flex:1;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;color:var(--text);font-size:13px;
}
.add-inline input:focus{outline:none;border-color:var(--blue-dim);}

.msg-item{
  border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:14px 16px;margin-bottom:10px;background:var(--panel);box-shadow:var(--shadow-sm);
}
.msg-item .msg-top{display:flex;justify-content:space-between;margin-bottom:6px;}
.msg-item .msg-title{font-weight:600;font-size:13.5px;}
.msg-item .msg-date{font-size:11px;color:var(--text-faint);}
.msg-item .msg-body{font-size:13px;color:var(--text-dim);white-space:pre-wrap;}

.file-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:10px;
  border:1px solid var(--line);margin-bottom:8px;font-size:13px;background:var(--panel);
}
.file-item .fx{color:var(--blue);font-size:10px;font-weight:600;border:1px solid var(--blue-dim);padding:2px 7px;border-radius:6px;}

/* ===== Modal ===== */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.28);
  display:none;align-items:center;justify-content:center;z-index:100;
  backdrop-filter:blur(6px);
}
.overlay.open{display:flex;}
.modal{
  background:var(--panel);border:1px solid var(--line);
  border-radius:18px;width:480px;max-width:92vw;
  max-height:86vh;overflow-y:auto;
  padding:26px;box-shadow:var(--shadow-lg);
}
.modal h2{font-family:var(--font-display);font-size:19px;margin-bottom:18px;font-weight:700;letter-spacing:-.01em;}
.field{margin-bottom:14px;}
.field label{
  display:block;font-size:11px;font-weight:600;
  letter-spacing:.02em;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px;
}
.field input, .field select, .field textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;color:var(--text);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--blue-dim);background:var(--panel);}
.field textarea{resize:vertical;min-height:70px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}

/* Toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  background:rgba(29,29,31,.92);border:1px solid rgba(255,255,255,.08);
  color:#fff;padding:11px 20px;border-radius:20px;
  font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
  z-index:200;box-shadow:var(--shadow-lg);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.back-link{
  font-size:12px;color:var(--text-faint);
  margin-bottom:14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
}
.back-link:hover{color:var(--blue);}

@media (max-width:820px){
  .sidebar{width:190px;}
  .stat-row{grid-template-columns:repeat(2,1fr);}
  .dash-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="shell">
  <div class="sidebar">
    <div class="logo">Histree <em>HQ</em></div>
    <div class="tagline">Studio Operations</div>

    <div class="sidebar-scroll">
      <div class="nav-group">
        <div class="nav-item active" data-view="dashboard">
          <span class="icon">⌂</span><span>Dashboard</span>
        </div>
        <div class="nav-item" data-view="clients">
          <span class="icon">◔</span><span>All Clients</span>
          <span class="count" id="navClientCount">0</span>
        </div>
        <div class="nav-item" data-view="projects">
          <span class="icon">▢</span><span>Projects</span>
          <span class="count" id="navProjectCount">0</span>
        </div>
        <div class="nav-item" data-view="tasks">
          <span class="icon">✓</span><span>My Tasks</span>
          <span class="count" id="navTaskCount">0</span>
        </div>
      </div>

      <div class="nav-group">
        <div class="nav-label">
          <span>Folders</span>
          <span class="add-mini" id="addFolderBtn" title="New folder">＋</span>
        </div>
        <div id="folderNavList"></div>
      </div>

      <div class="nav-group">
        <div class="nav-label">Pipeline</div>
        <div class="nav-item" data-view="projects" data-filter="active">
          <span class="dot" style="background:var(--blue)"></span>
          <span>Active work</span>
          <span class="count" id="navActiveCount">0</span>
        </div>
        <div id="stageNavList"></div>
      </div>
    </div>

    <div class="sidebar-foot">
      <button class="ghost-btn" id="exportBtn">↓ Export backup (.json)</button>
      <button class="ghost-btn" id="importBtn">↑ Import backup</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
  </div>

  <div class="main">
    <div class="topbar" id="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="topbar-spacer"></div>
      <div id="topbarActions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ Data layer ============ */
const DB_KEY = 'histree_hq_v1';

const STAGES = [
  {v:'not_contacted', l:'Not contacted'},
  {v:'follow_up_48h', l:'48h Follow up'},
  {v:'loom_sent', l:'Loom sent'},
  {v:'replied', l:'Replied'},
  {v:'booked_call', l:'Booked call'},
  {v:'no_response', l:'No response'},
  {v:'won', l:'Won'},
  {v:'lost', l:'Lost'},
];
function stageLabel(v){ const s = STAGES.find(x=>x.v===v); return s? s.l : 'Not contacted'; }

const DEFAULT_FOLDERS = [
  {id:'studios', name:'Studios'},
  {id:'leads', name:'Individual Leads'},
  {id:'agency', name:'Agency'},
];

function clientDefaults(){
  return { studio:'', website:'', location:'', ig:'', pricing:'', mailSent:false, stage:'not_contacted', dateAdded: todayISO(), folderId:'leads' };
}
function normalizeClient(c){
  return Object.assign(clientDefaults(), c);
}

function loadDB(){
  const raw = localStorage.getItem(DB_KEY);
  if(raw){
    try{
      const data = JSON.parse(raw);
      data.folders = (data.folders && data.folders.length) ? data.folders : DEFAULT_FOLDERS.slice();
      data.clients = (data.clients||[]).map(normalizeClient);
      data.projects = (data.projects||[]).map(p=> Object.assign({todos:[],messages:[],files:[]}, p));
      // One-time cleanup: strip out the old built-in demo entries (Podcafe / Dasha Shunina) if present.
      const demoEmails = ['alex@podcafe.fm','dasha@creator.co'];
      const demoClientIds = data.clients.filter(c=> demoEmails.includes((c.email||'').toLowerCase()) || c.name==='Podcafe' || c.name==='Dasha Shunina').map(c=>c.id);
      if(demoClientIds.length){
        data.clients = data.clients.filter(c=> !demoClientIds.includes(c.id));
        data.projects = data.projects.filter(p=> !demoClientIds.includes(p.clientId));
      }
      return data;
    }catch(e){}
  }
  return { folders: DEFAULT_FOLDERS.slice(), clients: [], projects: [] };
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fmtDateShort(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

let DB = loadDB();

/* ============ State ============ */
let state = { view:'dashboard', filter:null, folderFilter:null, stageFilter:null, activeProjectId:null, activeClientId:null, projectTab:'todos' };

/* ============ Render helpers ============ */
const content = document.getElementById('content');
const pageTitle = document.getElementById('pageTitle');
const topbarActions = document.getElementById('topbarActions');

function setView(view, filter=null, folderFilter=null, stageFilter=null){
  state.view = view; state.filter = filter; state.folderFilter = folderFilter; state.stageFilter = stageFilter;
  syncNavActive();
  render();
}

function syncNavActive(){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(state.folderFilter){
    const f = document.querySelector(`.nav-item[data-folder="${state.folderFilter}"]`);
    if(f) f.classList.add('active');
    return;
  }
  if(state.stageFilter){
    const s = document.querySelector(`.nav-item[data-stage="${state.stageFilter}"]`);
    if(s) s.classList.add('active');
    return;
  }
  const match = [...document.querySelectorAll('.nav-item')].find(n=>n.dataset.view===state.view && (n.dataset.filter||null)===state.filter && !n.dataset.folder && !n.dataset.stage);
  if(match) match.classList.add('active');
}

document.querySelectorAll('.sidebar .nav-item[data-view]').forEach(item=>{
  item.addEventListener('click', ()=> setView(item.dataset.view, item.dataset.filter||null, null, null));
});

/* ---- Folders ---- */
function renderFolderNav(){
  const wrap = document.getElementById('folderNavList');
  wrap.innerHTML = DB.folders.map(f=>{
    const count = DB.clients.filter(c=>c.folderId===f.id).length;
    return `
    <div class="nav-item" data-folder="${f.id}">
      <span class="icon">▤</span><span>${escapeHtml(f.name)}</span>
      <span class="count">${count}</span>
      <span class="folder-del" title="Delete folder" onclick="event.stopPropagation();deleteFolder('${f.id}')">×</span>
    </div>`;
  }).join('') || `<div style="font-size:12px;color:var(--text-faint);padding:6px 8px">No folders yet.</div>`;
  wrap.querySelectorAll('.nav-item[data-folder]').forEach(item=>{
    item.addEventListener('click', ()=> setView('clients', null, item.dataset.folder));
  });
}

/* ---- Pipeline stages — clients move between these automatically as their Stage changes ---- */
const STAGE_COLORS = {
  not_contacted:'var(--text-faint)', follow_up_48h:'var(--orange)', loom_sent:'var(--teal)',
  replied:'var(--green)', booked_call:'var(--green)', no_response:'var(--red)',
  won:'var(--blue)', lost:'var(--text-faint)',
};
function renderStageNav(){
  const wrap = document.getElementById('stageNavList');
  if(!wrap) return;
  wrap.innerHTML = STAGES.map(s=>{
    const count = DB.clients.filter(c=>c.stage===s.v).length;
    if(!count) return '';
    return `
    <div class="nav-item" data-stage="${s.v}">
      <span class="dot" style="background:${STAGE_COLORS[s.v]||'var(--text-faint)'}"></span>
      <span>${escapeHtml(s.l)}</span>
      <span class="count">${count}</span>
    </div>`;
  }).join('') || `<div style="font-size:12px;color:var(--text-faint);padding:6px 8px">No leads in the pipeline yet.</div>`;
  wrap.querySelectorAll('.nav-item[data-stage]').forEach(item=>{
    item.addEventListener('click', ()=> setView('clients', null, null, item.dataset.stage));
  });
}

function addFolder(){
  const name = prompt('New folder name (e.g. "Podcast Studios", "Warm Leads")');
  if(!name || !name.trim()) return;
  const id = uid();
  DB.folders.push({id, name:name.trim()});
  saveDB(); renderFolderNav(); showToast('Folder created');
}
document.getElementById('addFolderBtn').addEventListener('click', addFolder);

function deleteFolder(id){
  const f = DB.folders.find(x=>x.id===id);
  if(!f) return;
  if(!confirm(`Delete folder "${f.name}"? Clients inside it won't be deleted — they'll just be unfiled.`)) return;
  DB.folders = DB.folders.filter(x=>x.id!==id);
  DB.clients.forEach(c=>{ if(c.folderId===id) c.folderId=null; });
  saveDB();
  if(state.folderFilter===id) setView('clients');
  else { renderFolderNav(); render(); }
}
window.deleteFolder = deleteFolder;

function render(){
  updateNavCounts();
  renderFolderNav();
  renderStageNav();
  syncNavActive();
  topbarActions.innerHTML = '';
  if(state.view==='dashboard') renderDashboard();
  else if(state.view==='clients') renderClients();
  else if(state.view==='projects') renderProjects();
  else if(state.view==='tasks') renderTasks();
  else if(state.view==='clientDetail') renderClientDetail();
  else if(state.view==='projectDetail') renderProjectDetail();
}

function updateNavCounts(){
  document.getElementById('navClientCount').textContent = DB.clients.length;
  document.getElementById('navProjectCount').textContent = DB.projects.length;
  document.getElementById('navActiveCount').textContent = DB.projects.filter(p=>p.status==='active').length;
  const allTodos = DB.projects.flatMap(p=>p.todos.filter(t=>!t.done));
  document.getElementById('navTaskCount').textContent = allTodos.length;
}

function projectProgress(p){
  if(!p.todos.length) return 0;
  return Math.round(100 * p.todos.filter(t=>t.done).length / p.todos.length);
}

/* ============ Dashboard ============ */
function renderDashboard(){
  pageTitle.textContent = 'Dashboard';
  const activeProjects = DB.projects.filter(p=>p.status==='active');
  const leads = DB.clients.filter(c=>c.status==='lead');
  const openTasks = DB.projects.flatMap(p=>p.todos.filter(t=>!t.done));
  const pipelineValue = DB.clients.reduce((s,c)=> s + (c.status!=='closed'? (c.value||0):0), 0);

  const upcoming = DB.projects
    .flatMap(p=>p.todos.filter(t=>!t.done && t.due).map(t=>({...t, projectName:p.name, projectId:p.id})))
    .sort((a,b)=> a.due.localeCompare(b.due));

  const recentMsgs = DB.projects
    .flatMap(p=>p.messages.map(m=>({...m, projectName:p.name, projectId:p.id})))
    .sort((a,b)=> b.date.localeCompare(a.date))
    .slice(0,6);

  content.innerHTML = `
    <div class="stat-row">
      <div class="stat-card"><div class="accent-bar" style="background:var(--blue)"></div><div class="num">${activeProjects.length}</div><div class="label">Active Projects</div></div>
      <div class="stat-card"><div class="accent-bar" style="background:var(--teal)"></div><div class="num">${leads.length}</div><div class="label">Open Leads</div></div>
      <div class="stat-card"><div class="accent-bar" style="background:var(--red)"></div><div class="num">${openTasks.length}</div><div class="label">Open Tasks</div></div>
      <div class="stat-card"><div class="accent-bar" style="background:var(--text-faint)"></div><div class="num">$${pipelineValue.toLocaleString()}</div><div class="label">Pipeline Value / mo</div></div>
    </div>

    <div class="dash-grid">
      <div>
        <div class="section-title">Upcoming &amp; due tasks</div>
        ${upcoming.length ? upcoming.slice(0,8).map(t=>`
          <div class="timeline-item">
            <div class="tdot" style="background:${t.due < todayISO() ? 'var(--red)' : 'var(--blue)'}"></div>
            <div class="body">
              <div class="title">${escapeHtml(t.text)}</div>
              <div class="meta">${escapeHtml(t.projectName)} · due ${fmtDateShort(t.due)}</div>
            </div>
          </div>`).join('') : `<div class="empty-state"><div class="glyph">✓</div><div class="msg">Nothing due. Clear runway.</div></div>`}
      </div>
      <div>
        <div class="section-title">Recent notes</div>
        ${recentMsgs.length ? recentMsgs.map(m=>`
          <div class="timeline-item">
            <div class="tdot" style="background:var(--teal)"></div>
            <div class="body">
              <div class="title">${escapeHtml(m.title)}</div>
              <div class="meta">${escapeHtml(m.projectName)} · ${fmtDateShort(m.date)}</div>
            </div>
          </div>`).join('') : `<div class="empty-state"><div class="glyph">·</div><div class="msg">No notes logged yet.</div></div>`}
      </div>
    </div>
  `;
}

/* ============ Clients ============ */
let clientsViewMode = 'table';

function renderClients(){
  const folder = state.folderFilter ? DB.folders.find(f=>f.id===state.folderFilter) : null;
  const stage = state.stageFilter ? stageLabel(state.stageFilter) : null;
  pageTitle.textContent = folder ? folder.name : (stage ? stage : 'All Clients');
  topbarActions.innerHTML = `
    <div class="view-toggle">
      <button class="${clientsViewMode==='table'?'active':''}" onclick="setClientsViewMode('table')">Table</button>
      <button class="${clientsViewMode==='cards'?'active':''}" onclick="setClientsViewMode('cards')">Cards</button>
    </div>
    <button class="btn subtle" id="importClientsBtn">↑ Import sheet</button>
    <button class="btn primary" id="addClientBtn">+ New Client</button>
  `;
  document.getElementById('addClientBtn').onclick = ()=> openClientModal(null, state.folderFilter);
  document.getElementById('importClientsBtn').onclick = ()=> openImportModal(state.folderFilter);

  let list = DB.clients;
  if(state.filter) list = list.filter(c=>c.status===state.filter);
  if(state.folderFilter) list = list.filter(c=>c.folderId===state.folderFilter);
  if(state.stageFilter) list = list.filter(c=>c.stage===state.stageFilter);

  if(!list.length){
    const emptyMsg = folder ? `No clients in "${escapeHtml(folder.name)}" yet.`
      : stage ? `No clients at "${escapeHtml(stage)}" right now — change a client's stage and they'll show up here automatically.`
      : 'No clients here yet.';
    content.innerHTML = `<div class="empty-state"><div class="glyph">＋</div><div class="msg">${emptyMsg} Add one, or import your outreach sheet — pick a folder (Studios, Individual Leads, Agency, or your own) as you import.</div><button class="btn primary" onclick="openClientModal(null,'${state.folderFilter||''}')">+ New Client</button></div>`;
    return;
  }

  if(clientsViewMode==='cards'){
    content.innerHTML = `<div class="card-grid">${list.map(c=>{
      const projCount = DB.projects.filter(p=>p.clientId===c.id).length;
      const f = DB.folders.find(fo=>fo.id===c.folderId);
      return `
      <div class="client-card" onclick="openClientDetail('${c.id}')">
        <div class="card-top">
          <div class="card-name">${escapeHtml(c.name)}</div>
          <span class="badge status-${c.status}">${c.status}</span>
        </div>
        <div class="card-meta"><span class="lbl">Contact —</span> ${escapeHtml(c.contact||'—')}</div>
        <div class="card-meta"><span class="lbl">Source —</span> ${escapeHtml(c.platform||'—')}</div>
        <div class="card-meta"><span class="lbl">Value —</span> $${(c.value||0).toLocaleString()}/mo</div>
        <div class="card-tags"><span class="tag">${stageLabel(c.stage)}</span><span class="tag">${projCount} project${projCount!==1?'s':''}</span>${f?`<span class="tag">${escapeHtml(f.name)}</span>`:''}</div>
      </div>`;
    }).join('')}</div>`;
    return;
  }

  content.innerHTML = `
    <div class="import-hint">Every cell below saves as you type or change it — nothing to submit. Click a client name to open its full profile. Drag a column's right edge to resize it.</div>
    <div class="table-wrap"><table class="leads-table" id="clientsTable">
      <thead><tr>
        <th>Name</th><th>Studio</th><th>Email</th><th>Mail</th><th>Stage</th><th>Folder</th><th>Website</th><th>Location</th><th>IG</th><th>Pricing</th><th>Added</th><th></th>
      </tr></thead>
      <tbody>
      ${list.map(c=>{
        const f = DB.folders.find(fo=>fo.id===c.folderId);
        return `
        <tr>
          <td><a onclick="event.stopPropagation();openClientDetail('${c.id}')" style="cursor:pointer;color:var(--text);font-weight:600">${escapeHtml(c.name)||'—'}</a></td>
          <td class="wrap"><input class="cell-input" value="${escapeAttr(c.studio)}" onchange="updateClientField('${c.id}','studio',this.value)"></td>
          <td><input class="cell-input" value="${escapeAttr(c.email)}" onchange="updateClientField('${c.id}','email',this.value)" style="min-width:170px"></td>
          <td style="text-align:center"><input type="checkbox" class="mail-check" ${c.mailSent?'checked':''} onchange="updateClientField('${c.id}','mailSent',this.checked)"></td>
          <td>
            <select class="stage-select stage-${c.stage}" onchange="updateClientField('${c.id}','stage',this.value); this.className='stage-select stage-'+this.value;">
              ${STAGES.map(s=>`<option value="${s.v}" ${c.stage===s.v?'selected':''}>${s.l}</option>`).join('')}
            </select>
          </td>
          <td>
            <select class="stage-select" onchange="updateClientField('${c.id}','folderId',this.value||null)">
              <option value="">— None —</option>
              ${DB.folders.map(fo=>`<option value="${fo.id}" ${c.folderId===fo.id?'selected':''}>${escapeHtml(fo.name)}</option>`).join('')}
            </select>
          </td>
          <td class="wrap">${c.website? `<a href="${escapeAttr(c.website)}" target="_blank" rel="noopener">${escapeHtml(shortUrl(c.website))}</a>` : `<input class="cell-input" placeholder="—" onchange="updateClientField('${c.id}','website',this.value)">`}</td>
          <td><input class="cell-input" value="${escapeAttr(c.location)}" onchange="updateClientField('${c.id}','location',this.value)" style="min-width:110px"></td>
          <td class="wrap">${c.ig? `<a href="${escapeAttr(c.ig)}" target="_blank" rel="noopener">${escapeHtml(shortUrl(c.ig))}</a>` : `<input class="cell-input" placeholder="—" onchange="updateClientField('${c.id}','ig',this.value)">`}</td>
          <td class="wrap">${c.pricing? `<a href="${escapeAttr(c.pricing)}" target="_blank" rel="noopener">${escapeHtml(shortUrl(c.pricing))}</a>` : `<input class="cell-input" placeholder="—" onchange="updateClientField('${c.id}','pricing',this.value)">`}</td>
          <td style="font-size:11px;color:var(--text-faint)">${fmtDateShort(c.dateAdded)}</td>
          <td class="row-del" onclick="deleteClient('${c.id}')">×</td>
        </tr>
      `;}).join('')}
      </tbody>
    </table></div>
  `;
  makeTableResizable(document.getElementById('clientsTable'), 'colw_clients_table');
}
window.setClientsViewMode = (m)=>{ clientsViewMode = m; renderClients(); };

/* ---- Resizable columns (generic) ---- */
function makeTableResizable(table, storageKey){
  if(!table) return;
  const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
  const ths = table.querySelectorAll('thead th');
  ths.forEach((th, i)=>{
    if(saved[i]) th.style.width = saved[i] + 'px';
    let handle = th.querySelector('.col-resize-handle');
    if(!handle){
      handle = document.createElement('div');
      handle.className = 'col-resize-handle';
      th.appendChild(handle);
    }
    handle.onmousedown = function(e){
      e.preventDefault(); e.stopPropagation();
      handle.classList.add('active');
      const startX = e.pageX;
      const startWidth = th.getBoundingClientRect().width;
      document.body.style.cursor = 'col-resize';
      function onMove(ev){
        const newWidth = Math.max(50, startWidth + (ev.pageX - startX));
        th.style.width = newWidth + 'px';
      }
      function onUp(){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        document.body.style.cursor = '';
        handle.classList.remove('active');
        const widths = JSON.parse(localStorage.getItem(storageKey) || '{}');
        widths[i] = Math.round(th.getBoundingClientRect().width);
        localStorage.setItem(storageKey, JSON.stringify(widths));
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    };
  });
}

function shortUrl(u){
  try{ const url = new URL(u); return url.hostname.replace(/^www\./,'') + (url.pathname!=='/'? url.pathname.slice(0,18)+(url.pathname.length>18?'…':'') : ''); }
  catch(e){ return u.length>28? u.slice(0,28)+'…' : u; }
}

function updateClientField(id, field, value){
  const c = DB.clients.find(x=>x.id===id);
  if(!c) return;
  c[field] = value;
  saveDB();
  if(field==='folderId') { renderFolderNav(); if(state.folderFilter) renderClients(); }
  if(field==='stage') { renderStageNav(); if(state.stageFilter) renderClients(); }
}
window.updateClientField = updateClientField;

/* ---- Import from spreadsheet (CSV / XLSX / Google Sheets link / pasted cells) ---- */
let importTab = 'file';
let importFolderId = null;

function openImportModal(presetFolderId=null){
  importTab = 'file';
  importFolderId = presetFolderId || (DB.folders[0] ? DB.folders[0].id : null);
  modalBody.innerHTML = importModalHTML();
  overlay.classList.add('open');
  document.getElementById('importFileInput').addEventListener('change', handleClientImportFile);
  bindFolderSelect();
}
window.openImportModal = openImportModal;

function importModalHTML(){
  return `
    <h2>Import leads</h2>
    <div class="field" style="margin-bottom:16px">
      <label>Import into folder</label>
      <select id="importFolderSelect">
        <option value="">— None (unfiled) —</option>
        ${DB.folders.map(f=>`<option value="${f.id}" ${importFolderId===f.id?'selected':''}>${escapeHtml(f.name)}</option>`).join('')}
        <option value="__new__">＋ Create new folder…</option>
      </select>
    </div>
    <div class="tabs" style="margin:0 0 16px">
      <div class="tab ${importTab==='file'?'active':''}" onclick="switchImportTab('file')">Upload file</div>
      <div class="tab ${importTab==='paste'?'active':''}" onclick="switchImportTab('paste')">Paste cells</div>
      <div class="tab ${importTab==='link'?'active':''}" onclick="switchImportTab('link')">Google Sheets link</div>
    </div>
    <div id="importTabBody">${importTabBodyHTML()}</div>
    <div class="modal-actions"><button class="btn subtle" onclick="closeModal()">Cancel</button></div>
  `;
}

function bindFolderSelect(){
  const sel = document.getElementById('importFolderSelect');
  if(!sel) return;
  sel.addEventListener('change', ()=>{
    if(sel.value === '__new__'){
      const name = prompt('New folder name (e.g. "Podcast Studios")');
      if(name && name.trim()){
        const id = uid();
        DB.folders.push({id, name:name.trim()});
        saveDB(); renderFolderNav();
        importFolderId = id;
        modalBody.innerHTML = importModalHTML();
        document.getElementById('importFileInput').addEventListener('change', handleClientImportFile);
        bindFolderSelect();
        const idx = importTab==='file'?0:importTab==='paste'?1:2;
        document.querySelectorAll('#modalBody .tab').forEach(t=>t.classList.remove('active'));
        document.querySelectorAll('#modalBody .tab')[idx].classList.add('active');
      } else {
        sel.value = importFolderId || '';
      }
    } else {
      importFolderId = sel.value || null;
    }
  });
}

function importTabBodyHTML(){
  if(importTab==='file'){
    return `
      <div class="import-hint" style="margin-bottom:12px">Upload a .csv or .xlsx export. Matches columns like Name, Studios Name / Agency Name, Email, Status, Website, Location, IG, Pricings, Date — any order. If the file has multiple tabs, you'll pick which one to import.</div>
      <input type="file" id="importFileInput" accept=".csv,.xlsx,.xls">
      <div id="sheetPickerWrap"></div>
    `;
  }
  if(importTab==='paste'){
    return `
      <div class="import-hint" style="margin-bottom:12px">Select your rows in Google Sheets or Excel (including the header row), copy (Ctrl/Cmd+C), and paste below.</div>
      <textarea id="pasteArea" placeholder="Paste copied spreadsheet cells here…" style="width:100%;min-height:160px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);font-family:var(--font-mono);font-size:11.5px"></textarea>
      <div class="modal-actions" style="margin-top:12px"><button class="btn primary" onclick="importFromPaste()">Import pasted rows</button></div>
    `;
  }
  return `

function handleClientImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      if(ext==='csv'){
        const rows = parseCSV(reader.result);
        importClientRows(rows);
        closeModal();
        return;
      }
      const wb = XLSX.read(reader.result, {type:'binary'});
      if(wb.SheetNames.length === 1){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
        importClientRows(rows);
        closeModal();
      } else {
        showSheetPicker(wb);
      }
    }catch(err){
      showToast('Could not read that file — try CSV or XLSX');
      console.error(err);
    }
  };
  if(ext==='csv') reader.readAsText(file);
  else reader.readAsBinaryString(file);
  e.target.value = '';
}

async function importFromGoogleLink(){
  const url = document.getElementById('sheetLinkInput').value.trim();
  const statusEl = document.getElementById('linkImportStatus');
  const match = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if(!match){ statusEl.textContent = 'That doesn\'t look like a Google Sheets link.'; return; }
  const gidMatch = url.match(/[#&]gid=([0-9]+)/);
  const gid = gidMatch ? gidMatch[1] : '0';
  const exportUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv&gid=${gid}`;
  statusEl.textContent = 'Fetching…';
  try{
    const res = await fetch(exportUrl);
    if(!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    if(text.trim().startsWith('<')) throw new Error('not shared publicly');
    const rows = parseCSV(text);
    importClientRows(rows);
    closeModal();
  }catch(err){
    statusEl.innerHTML = `Couldn't fetch that sheet — it needs to be shared as "Anyone with the link can view." <br>Alternative: File → Download → CSV in Google Sheets, then use the "Upload file" tab.`;
  }
}
window.importFromGoogleLink = importFromGoogleLink;

function parseCSV(text){ return parseDelimited(text, ','); }

function parseDelimited(text, delim){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return [];
  const splitLine = (line)=>{
    if(delim==='\t') return line.split('\t');
    const out=[]; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(ch==='"'){ if(inQ && line[i+1]==='"'){ cur+='"'; i++; } else inQ=!inQ; }
      else if(ch===',' && !inQ){ out.push(cur); cur=''; }
      else cur+=ch;
    }
    out.push(cur); return out;
  };
  const headers = splitLine(lines[0]).map(h=>h.trim());
  return lines.slice(1).map(line=>{
    const cells = splitLine(line);
    const row = {};
    headers.forEach((h,i)=> row[h] = (cells[i]||'').trim());
    return row;
  });
}

function findCol(row, candidates){
  const keys = Object.keys(row);
  for(const cand of candidates){
    const hit = keys.find(k=> k.toLowerCase().replace(/[^a-z]/g,'') === cand.toLowerCase().replace(/[^a-z]/g,''));
    if(hit) return row[hit];
  }
  return '';
}

function importClientRows(rows){
  if(!rows || !rows.length){ showToast('No rows found in that file'); return; }
  const folderId = importFolderId || null;
  let added = 0, skipped = 0;
  rows.forEach(row=>{
    const name = findCol(row, ['Name']);
    const studio = findCol(row, ['Studios Name','Studio Name','Studio','Agency Name','Agency','Podcast Name','Channel Name']);
    const label = (name || studio || '').toString().trim();
    if(!label){ skipped++; return; }
    const email = findCol(row, ['Email']);
    const website = findCol(row, ['Website','Channel','Youtube','YouTube']);
    const location = findCol(row, ['Location']);
    const ig = findCol(row, ['IG','Instagram']);
    const pricing = findCol(row, ['Pricings','Pricing']);
    const mailRaw = findCol(row, ['Mail']);
    const statusRaw = (findCol(row, ['Status','Status 2'])||'').toString().trim().toLowerCase();
    const dateRaw = findCol(row, ['Date']);
    const noteRaw = findCol(row, ['1 Content Note','Content Note','1 Personal Note','Personal Note','Note','Notes']);

    let stage = 'not_contacted';
    if(/loom/.test(statusRaw)) stage = 'loom_sent';
    else if(/48h|follow/.test(statusRaw)) stage = 'follow_up_48h';
    else if(/repl/.test(statusRaw)) stage = 'replied';
    else if(/book/.test(statusRaw)) stage = 'booked_call';
    else if(/won/.test(statusRaw)) stage = 'won';
    else if(/lost|declin/.test(statusRaw)) stage = 'lost';
    else if(/no response|ghost/.test(statusRaw)) stage = 'no_response';

    const already = DB.clients.find(c=> (email && c.email===email) || (c.name===label && c.studio===studio));
    const data = {
      name: label,
      contact: name && studio ? name : '',
      email: (email||'').toString(),
      platform: 'Imported sheet',
      status: 'lead',
      value: 0,
      notes: noteRaw ? String(noteRaw) : (already ? already.notes : ''),
      studio: (studio||'').toString(),
      website: (website||'').toString(),
      location: (location||'').toString(),
      ig: (ig||'').toString(),
      pricing: (pricing||'').toString(),
      mailSent: /^(true|1|yes|x|✓)$/i.test((mailRaw||'').toString().trim()),
      stage,
      dateAdded: dateRaw ? String(dateRaw) : todayISO(),
      folderId: already ? (already.folderId || folderId) : folderId,
    };
    if(already){
      Object.assign(already, data, {id:already.id, createdAt:already.createdAt});
    } else {
      DB.clients.push(normalizeClient({id:uid(), createdAt:todayISO(), ...data}));
      added++;
    }
  });
  saveDB();
  showToast(`Imported ${added} new lead${added!==1?'s':''}${rows.length-added-skipped>0? `, updated ${rows.length-added-skipped}`:''}${skipped>0? `, skipped ${skipped} blank row${skipped!==1?'s':''}`:''}`);
  clientsViewMode = 'table';
  setView('clients', null, folderId);
}

      <div class="field"><label>Instagram</label><input id="f_ig" placeholder="https://instagram.com/…" value="${editing?escapeAttr(editing.ig||''):''}"></div>
    </div>
    <div class="field"><label>Pricing link</label><input id="f_pricing" placeholder="https://…" value="${editing?escapeAttr(editing.pricing||''):''}"></div>
    <div class="field"><label>Notes</label><textarea id="f_notes">${editing?escapeHtml(editing.notes||''):''}</textarea></div>
    <div class="modal-actions">
      <button class="btn subtle" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="saveClient(${editing?`'${editing.id}'`:'null'})">${editing?'Save changes':'Add client'}</button>
    </div>
  `;
  overlay.classList.add('open');
}
window.openClientModal = openClientModal;

function saveClient(id){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ showToast('Name is required'); return; }
  const data = {
    name,
    contact: document.getElementById('f_contact').value.trim(),
    email: document.getElementById('f_email').value.trim(),
    platform: document.getElementById('f_platform').value.trim(),
    value: parseFloat(document.getElementById('f_value').value)||0,
    status: document.getElementById('f_status').value,
    stage: document.getElementById('f_stage').value,
    folderId: document.getElementById('f_folder').value || null,
    studio: document.getElementById('f_studio').value.trim(),
    location: document.getElementById('f_location').value.trim(),
    website: document.getElementById('f_website').value.trim(),
    ig: document.getElementById('f_ig').value.trim(),
    pricing: document.getElementById('f_pricing').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
  };
  if(id){
    Object.assign(DB.clients.find(c=>c.id===id), data);
  } else {
    DB.clients.push(normalizeClient({id:uid(), createdAt:todayISO(), dateAdded:todayISO(), ...data}));
  }
  saveDB(); closeModal(); showToast(id?'Client updated':'Client added');
  render();
}
window.saveClient = saveClient;

function deleteClient(id){
  if(!confirm('Delete this client? Linked projects will remain but become unassigned.')) return;
  DB.clients = DB.clients.filter(c=>c.id!==id);
  DB.projects.forEach(p=>{ if(p.clientId===id) p.clientId=null; });
  saveDB(); setView('clients'); showToast('Client deleted');
}
window.deleteClient = deleteClient;

function openProjectModal(id=null, presetClientId=null){
  const editing = id ? DB.projects.find(p=>p.id===id) : null;
  const clientOptions = DB.clients.map(c=>`<option value="${c.id}" ${(editing&&editing.clientId===c.id)||presetClientId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('');
  modalBody.innerHTML = `
    <h2>${editing?'Edit Project':'New Project'}</h2>
    <div class="field"><label>Project name</label><input id="f_pname" value="${editing?escapeAttr(editing.name):''}" placeholder="e.g. Skyline Studios — Weekly Episode Edit"></div>
    <div class="field"><label>Client</label><select id="f_pclient"><option value="">— None —</option>${clientOptions}</select></div>
    <div class="field-row">
      <div class="field"><label>Status</label>
        <select id="f_pstatus">
          <option value="lead" ${editing&&editing.status==='lead'?'selected':''}>Lead</option>
          <option value="active" ${editing&&editing.status==='active'?'selected':''}>Active</option>
          <option value="paused" ${editing&&editing.status==='paused'?'selected':''}>Paused</option>
          <option value="closed" ${editing&&editing.status==='closed'?'selected':''}>Closed</option>
        </select>
      </div>
      <div class="field"><label>Due date</label><input id="f_pdue" type="date" value="${editing?editing.dueDate||'':''}"></div>
    </div>
    <div class="field"><label>Budget ($)</label><input id="f_pbudget" type="number" value="${editing?editing.budget||0:''}"></div>
    <div class="modal-actions">
      <button class="btn subtle" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="saveProject(${editing?`'${editing.id}'`:'null'})">${editing?'Save changes':'Create project'}</button>
    </div>
  `;
  overlay.classList.add('open');
}
window.openProjectModal = openProjectModal;

function saveProject(id){
  const name = document.getElementById('f_pname').value.trim();
  if(!name){ showToast('Project name is required'); return; }
  const data = {
    name,
    clientId: document.getElementById('f_pclient').value || null,
    status: document.getElementById('f_pstatus').value,
    dueDate: document.getElementById('f_pdue').value || null,
    budget: parseFloat(document.getElementById('f_pbudget').value)||0,
  };
  if(id){
    Object.assign(DB.projects.find(p=>p.id===id), data);
  } else {
    DB.projects.push({id:uid(), todos:[], messages:[], files:[], ...data});
  }
  saveDB(); closeModal(); showToast(id?'Project updated':'Project created');
  render();
}
window.saveProject = saveProject;

function deleteProject(id){
  if(!confirm('Delete this project and all its tasks/notes? This can\'t be undone.')) return;
  DB.projects = DB.projects.filter(p=>p.id!==id);
  saveDB(); setView('projects'); showToast('Project deleted');
}
window.deleteProject = deleteProject;

/* ============ Utilities ============ */
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str).replace(/`/g,'&#96;'); }

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* Export / Import (full backup) */
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `histree-hq-backup-${todayISO()}.json`;
  a.click(); URL.revokeObjectURL(url);
  showToast('Backup downloaded');
});
document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.clients || !data.projects) throw new Error('bad shape');
      if(!data.folders || !data.folders.length) data.folders = DEFAULT_FOLDERS.slice();
      if(confirm('This will replace your current data with the imported backup. Continue?')){
        DB = data; saveDB(); setView('dashboard'); showToast('Backup imported');
      }
    }catch(err){ showToast('Could not read that file'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ============ Init ============ */
render();
</script>
</body>
</html>
