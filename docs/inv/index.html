<html lang="en">
<head>
<meta charset="UTF-8">
<title>Histree Studios — Outreach Console</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{

    --text-dim:#9a9a9f;
    --gold:#c9a24b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:36px 5vw 24px;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(ellipse at top left, rgba(200,16,46,0.12), transparent 60%),
      var(--bg);
  }
  .eyebrow{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:0.25em;
    color:var(--red);
    font-size:13px;
    margin-bottom:6px;
  }
  h1{
    font-family:'Syne',sans-serif;
    font-weight:800;
    font-size:clamp(28px,4vw,44px);
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  header p{
    color:var(--text-dim);
    margin:0;
    max-width:640px;
    font-size:14.5px;
    line-height:1.5;
  }

  .controls{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(10,10,11,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:18px 5vw;
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    align-items:flex-end;
  }
  .field{display:flex; flex-direction:column; gap:6px; flex:1; min-width:160px;}
  .field label{
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:600;
  }
  .field input{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 12px;
    border-radius:6px;
    font-size:14.5px;
    font-family:'Inter',sans-serif;
    outline:none;
    transition:border-color .15s;
  }
  .field input:focus{border-color:var(--red);}
  .field input::placeholder{color:#55555a;}

  nav.tabs{
    display:flex;
    gap:2px;
    padding:0 5vw;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  nav.tabs button{
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:'Syne',sans-serif;
    font-weight:700;
    font-size:13.5px;
    padding:16px 18px;
    cursor:pointer;
    white-space:nowrap;
    border-bottom:2px solid transparent;
    transition:color .15s, border-color .15s;
  }
  nav.tabs button:hover{color:var(--text);}
  nav.tabs button.active{
    color:var(--text);
    border-bottom:2px solid var(--red);
  }
  .tab-count{
    color:var(--red);
    font-family:'Bebas Neue',sans-serif;
    margin-left:6px;
    font-size:12px;
  }

  .best-note{
    max-width:720px;
    margin:0 0 26px;
    background:var(--panel);
    border:1px solid var(--gold);
    border-radius:8px;
    padding:16px 18px;
  }
  .best-note-head{
    font-family:'Syne',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:8px;
  }
  .best-note ul{
    margin:0;
    padding-left:18px;
    color:var(--text);
    font-size:13.5px;
    line-height:1.6;
  }
  .best-note li{margin-bottom:4px;}

  main{padding:32px 5vw 80px;}

  .stage-note{
    color:var(--text-dim);
    font-size:13.5px;
    line-height:1.6;
    max-width:720px;
    margin:0 0 26px;
    padding:14px 16px;
    border-left:2px solid var(--red-dim);
    background:var(--panel);
    border-radius:0 6px 6px 0;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(340px,1fr));
    gap:16px;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 18px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    position:relative;
  }
  .card.best{
    border-color:var(--gold);
    box-shadow:0 0 0 1px rgba(201,162,75,0.15);
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .idx{
    font-family:'Bebas Neue',sans-serif;
    color:var(--red);
    font-size:22px;
    letter-spacing:0.03em;
  }
  .badge{
    font-size:10px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--bg);
    background:var(--gold);
    padding:3px 8px;
    border-radius:20px;
    font-weight:700;
  }
  .subject{
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:0.02em;
  }
  .subject b{color:var(--text); font-weight:600;}
  .body-text{
    font-size:13.5px;
    line-height:1.6;
    color:var(--text);
    white-space:pre-wrap;
    flex:1;
  }
  .copy-btn{

    margin-top:4px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 14px;
    border-radius:6px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, border-color .15s;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .copy-btn:hover{border-color:var(--red);}
  .copy-btn.copied{
    background:var(--red);
    border-color:var(--red);
  }

  ::-webkit-scrollbar{height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
</style>
</head>

  const studio = document.getElementById('sname').value.trim() || '[Studio Name]';
  const you = document.getElementById('yname').value.trim() || 'Joe Ahammed';
  return str.replaceAll('{name}',name).replaceAll('{studio}',studio).replaceAll('{you}',you);
}

function buildTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = STAGES.map(st =>
    `<button class="${st.key===activeStage?'active':''}" onclick="setStage('${st.key}')">${st.label}<span class="tab-count">${st.items.length}</span></button>`
  ).join('');
}

function setStage(key){
  activeStage = key;
  buildTabs();
  renderAll();
}

let currentPayloads = [];

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderAll(){
  const stage = STAGES.find(s=>s.key===activeStage);
  document.getElementById('stageNote').textContent = stage.note;
  const grid = document.getElementById('grid');
  currentPayloads = [];
  grid.innerHTML = stage.items.map((item, i) => {
    const num = i+1;
    const isBest = stage.best.includes(num);
    const subjectHtml = stage.hasSubject ? `<div class="subject">Subject: <b>${escapeHtml(fillValue(item.s))}</b></div>` : '';
    const bodyFilled = fillValue(item.b);
    const copyPayload = stage.hasSubject ? `Subject: ${fillValue(item.s)}\n\n${bodyFilled}` : bodyFilled;
    currentPayloads.push(copyPayload);
    return `
      <div class="card ${isBest?'best':''}">
        <div class="card-top">
          <span class="idx">${String(num).padStart(2,'0')}</span>
          ${isBest?'<span class="badge">Best pick</span>':''}
        </div>
        ${subjectHtml}
        <div class="body-text">${escapeHtml(bodyFilled)}</div>
        <button class="copy-btn" data-index="${i}" onclick="copyCard(this)">
          Copy
        </button>
      </div>`;
  }).join('');
}

function copyCard(btn){
  const i = parseInt(btn.getAttribute('data-index'), 10);
  const text = currentPayloads[i];
  const onSuccess = () => {
    const original = btn.textContent;
    btn.textContent = 'Copied ✓';
    btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = original; btn.classList.remove('copied'); }, 1400);
  };
  const fallbackCopy = () => {
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      onSuccess();
    }catch(e){
      btn.textContent = 'Copy failed — select manually';
      setTimeout(()=>{ btn.textContent = 'Copy'; }, 2000);
    }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onSuccess).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
}

buildTabs();
renderAll();
</script>
</body>
</html>
