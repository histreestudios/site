name: Encrypt Invoice Page

on:
  push:
    branches: [ main ]

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install Staticrypt
        run: npm install -g staticrypt
      
      - name: Encrypt the invoice page
        run: |
          cd docs/inv
          staticrypt index.html -p ${{ secrets.INVOICE_PASSWORD }} -o index.html
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/inv/index.html
          git commit -m "🔒 Encrypt invoice page" || echo "No changes to commit"
          git push
